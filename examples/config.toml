[project]
# Leave name and repository_url blank to derive them from GitHub Actions.
name = ""
tagline = "A self-hosted quality snapshot for this Go project."
repository_url = ""
source_dir = "."
accent = "#e4572e"
exclude = [
  "vendor/**",
  "**/testdata/**",
  "*_generated.go",
  "**/*_generated.go",
  "*.pb.go",
  "**/*.pb.go",
]

[quality]
minimum_score = 80
details_limit = 80
command_timeout_seconds = 300

[checks.format]
enabled = true
weight = 15

[checks.vet]
enabled = true
weight = 20

[checks.build]
enabled = true
weight = 20

[checks.tests]
enabled = true
weight = 30
coverage_target = 70

[checks.modules]
enabled = true
weight = 15

# Add project-specific checks without changing the generator. Commands are
# executed directly (never through a shell), relative to project.source_dir.
#
# [[custom_checks]]
# id = "staticcheck"
# label = "Staticcheck"
# description = "Advanced static analysis is clean."
