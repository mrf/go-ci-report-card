# Lint configuration for the repository's own Python tooling.
# The generator itself stays dependency-free; ruff and mypy are dev-only tools.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Formatter conflicts (ruff format owns these concerns).
  "COM812", # missing-trailing-comma
  # Mutually exclusive pydocstyle pairs; we use D211 and D212.
  "D203", # incorrect-blank-line-before-class
  "D213", # multi-line-summary-second-line
  # Config validation raises a single ConfigurationError with a contextual
  # message at ~20 sites; the fixes these rules want (message variables,
  # per-error exception classes) would bloat the validator without value.
  "EM101",  # raw-string-in-exception
  "EM102",  # f-string-in-exception
  "TRY003", # raise-vanilla-args
]

[tool.ruff.lint.per-file-ignores]
"reportcard/generate.py" = [
  "T201", # print is this CLI's status output
]
"tests/*" = [
  "S101", # assert is the mechanism of a unittest module-level sanity check
  "PT",   # flake8-pytest-style: suite deliberately uses stdlib unittest, not pytest
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["reportcard", "tests"]
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "exhaustive-match",
]
