name: Go CI Report Card

on:
  workflow_call:
    inputs:
      min-score:
        description: Minimum score for the quality gate to pass.
        type: string
        required: false
        default: ""
      coverage-target:
        description: Coverage percentage that earns full marks on the tests check.
        type: string
        required: false
        default: ""
      config:
        description: Path to a TOML config file. Built-in defaults apply when empty.
        type: string
        required: false
        default: ""
      source-dir:
        description: Directory containing go.mod, relative to the repository root.
        type: string
        required: false
        default: ""
      name:
        description: Project name shown in the report. Derived from the repository when empty.
        type: string
        required: false
        default: ""
      go-version-file:
        description: File actions/setup-go reads the Go version from.
        type: string
        required: false
        default: go.mod
    outputs:
      passed:
        description: "\"true\" when the score met the minimum, otherwise \"false\"."
        value: ${{ jobs.analyze.outputs.passed }}
      score:
        description: Overall score, one decimal place.
        value: ${{ jobs.analyze.outputs.score }}
      grade:
        description: Letter grade for the overall score.
        value: ${{ jobs.analyze.outputs.grade }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze:
    name: Analyze and build report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      passed: ${{ steps.report.outputs.passed }}
      score: ${{ steps.report.outputs.score }}
      grade: ${{ steps.report.outputs.grade }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Generate static report
        id: report
        uses: mrf/go-ci-report-card@v1
        with:
          config: ${{ inputs.config }}
          source-dir: ${{ inputs.source-dir }}
          min-score: ${{ inputs.min-score }}
          coverage-target: ${{ inputs.coverage-target }}
          name: ${{ inputs.name }}
          output: _site

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish report
    if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check analysis completed
        if: ${{ needs.analyze.result != 'success' }}
        run: |
          echo "Report generation did not complete."
          exit 1

      - name: Enforce minimum score
        if: ${{ needs.analyze.outputs.passed != 'true' }}
        env:
          REPORT_SCORE: ${{ needs.analyze.outputs.score }}
          REPORT_GRADE: ${{ needs.analyze.outputs.grade }}
        run: |
          echo "Quality gate failed: grade ${REPORT_GRADE}, score ${REPORT_SCORE}."
          exit 1

      - name: Confirm quality gate
        if: ${{ needs.analyze.outputs.passed == 'true' }}
        env:
          REPORT_SCORE: ${{ needs.analyze.outputs.score }}
          REPORT_GRADE: ${{ needs.analyze.outputs.grade }}
        run: echo "Quality gate passed with grade ${REPORT_GRADE} (${REPORT_SCORE})."
