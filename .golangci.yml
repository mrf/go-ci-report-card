# Strictest-by-default: every linter enabled; each disable below is deliberate.
version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    # depguard needs a hand-written import allowlist; the only third-party
    # import is BurntSushi/toml, so there is no import policy to enforce.
    - depguard
    # Config structs overlay defaults, so partial literals are the design;
    # exhaustruct would force every zero field to be spelled out.
    - exhaustruct
    - exhaustruct_v5
    # Contradicts the idiomatic `if err := f(); err != nil` form.
    - noinlineerr
    # Superseded by wsl_v5 and gomodguard_v2, which stay enabled.
    - wsl
    - gomodguard
  settings:
    errcheck:
      exclude-functions:
        # Diagnostics written to stderr; a failed write cannot be reported anywhere else.
        - fmt.Fprintf
        - fmt.Fprintln
    tagliatelle:
      case:
        rules:
          # report.json schema_version 1 is snake_case by contract with the
          # published pages; TOML keys follow the shipped config file.
          json: snake
          toml: snake
    varnamelen:
      # Idiomatic short names in tight scopes.
      ignore-names: [fs, tc, i, r, sb, re, ok, p, c, e, o]
      ignore-decls:
        - t *testing.T
  exclusions:
    rules:
      # Test tables and helpers legitimately repeat literals and run long,
      # and read back files they wrote under t.TempDir (gosec G304).
      - path: _test\.go
        linters: [funlen, lll, goconst, maintidx, dupl, gocognit, cyclop, gosec]

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mrf/go-ci-report-card
